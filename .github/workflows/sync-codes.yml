name: sync-codes

# Folds community-confirmed gift-code verdicts from the Worker queue into
# data/codes.json. Presets are NOT touched here — those arrive only through the
# approved-preset issue form, reviewed by a human.

on:
  schedule:
    # Every 6 hours. Codes expire on Garena's schedule, not ours, so a tighter
    # loop buys nothing and burns Action minutes.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the merge without committing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Two overlapping runs would both read /pending, both commit, and one would
  # lose to a push race. Serialise them.
  group: sync-codes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The job used to be gated on `vars.VAULT_URL != ''` while the deployment
      # actually stores the endpoint in the secret GH_VAULT_ENDPOINT (as the
      # README instructs). The variable was therefore always empty, the gate never
      # opened, and every scheduled run reported success while doing nothing — the
      # queue sat at 291 rows for a day with a green tick. Secrets cannot be read
      # in a job-level `if`, so check inside a step and skip the rest explicitly.
      - name: Check the vault is configured
        id: config
        env:
          VAULT_URL: ${{ secrets.GH_VAULT_ENDPOINT }}
          VAULT_ADMIN_TOKEN: ${{ secrets.GH_VAULT_ADMIN_TOKEN }}
        run: |
          if [ -z "$VAULT_URL" ] || [ -z "$VAULT_ADMIN_TOKEN" ]; then
            echo "::notice::GH_VAULT_ENDPOINT / GH_VAULT_ADMIN_TOKEN are not set; nothing to sync"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge promoted rows
        id: merge
        if: steps.config.outputs.ready == 'true'
        env:
          VAULT_URL: ${{ secrets.GH_VAULT_ENDPOINT }}
          VAULT_ADMIN_TOKEN: ${{ secrets.GH_VAULT_ADMIN_TOKEN }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          node tools/merge-pending.js $ARGS | tee merge.log
          # The script prints CHANGED=true/false as its last meaningful line.
          if grep -q 'CHANGED=true' merge.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f merge.log

      - name: Validate the merged file before committing
        if: steps.merge.outputs.changed == 'true' && inputs.dry_run != true
        run: node tools/validate-data.js

      - name: Commit
        if: steps.merge.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          git config user.name 'df-redeem-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/codes.json
          # A no-op add (identical content) must not fail the job.
          git diff --cached --quiet && echo 'nothing staged' && exit 0
          COUNT=$(node -e "const d=require('./data/codes.json');console.log(d.codes.length)")
          git commit -m "data: sync community code verdicts ($COUNT codes)"
          git push
